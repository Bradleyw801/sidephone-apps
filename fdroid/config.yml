---
# Brad White's apps: an F-Droid-format repository served from GitHub Pages.
# Secrets never live in this file. The index-signing keystore is restored from the
# FDROID_KEYSTORE_B64 GitHub secret at build time and the passwords come from the
# FDROID_KEYSTORE_PASS / FDROID_KEY_PASS secrets.

repo_url: https://bradleyw801.github.io/sidephone-apps/repo
repo_name: Brad White's apps
repo_description: >-
  Apps by Brad White: Slickrock Station and the RetroArch build it launches, Tyle for
  the Sidephone SP-01's keypad tiles, and Relay and Texts, which carry every text from
  one phone to another. Add this repository to F-Droid, Droid-ify or the Sidephone's
  App Library and the apps install and update from here.
repo_icon: icon.png

# No archive repo: the newest version of each app is what gets served.
archive_older: 0

keystore: keystore.p12
repo_keyalias: sidephone
keystorepass: {env: FDROID_KEYSTORE_PASS}
keypass: {env: FDROID_KEY_PASS}
keydname: CN=Sidephone apps by Brad White, OU=F-Droid, O=Brad White, C=US

# Everything here is a prebuilt APK, so skip the source checks fdroidserver does for apps it builds.
make_current_version_link: false
update_stats: false
