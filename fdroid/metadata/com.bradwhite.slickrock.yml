Name: Slickrock Station
Summary: Retro game launcher that sets up RetroArch for keys, controllers and touch
Description: |
  Slickrock Station sets up RetroArch for you: cores, controls, overlays and
  settings for each system, with a picture of the real controller while you map
  it. It is built for keyboard phones such as the Unihertz Titan 2 Elite, phones
  with built-in controls such as the Sidephone SP-01, Android TV with a gamepad,
  and plain touchscreen phones.

  * A game library grouped by system, with box art and type-to-search
  * Controls drawn on the controller in your hands: a phone's keys or keypad
    tile, a gamepad, or the touchscreen
  * One complete RetroArch setup written per system, so each console gets its
    own layout, overlay and core options
  * Autosave on exit, with resume or start over when you come back

  Install "RetroArch for Slickrock" from this repository as well. Slickrock
  Station launches it, and it keeps its settings apart from any other
  RetroArch on the device.

