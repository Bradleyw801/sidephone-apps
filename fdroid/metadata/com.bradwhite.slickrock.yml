Name: Slickrock Station
Summary: Game launcher that sets up RetroArch for you
Description: |
  Slickrock Station does the RetroArch setup for you. It installs the cores,
  sets up the controls, overlays and settings for each system, and shows a
  picture of the controller you're holding while you map it. Then you just
  pick a game and play.

  I made it for phones with physical keys, Android devices with a controller
  connected, and touchscreens.

  Your games are sorted by system with box art, and you can type to search.
  Each system gets its own layout, overlay and core settings. When you leave
  a game it saves your place, and when you come back you can pick up where
  you left off or start over.

  Install RetroArch for Slickrock from this repository too. That's the
  RetroArch build Slickrock Station runs, and it keeps its settings separate
  from any other RetroArch on your device.

RequiresRoot: false

