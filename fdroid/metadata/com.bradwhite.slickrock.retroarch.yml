Name: RetroArch for Slickrock
Summary: RetroArch 1.22.2 built for Slickrock Station
Description: |
  The RetroArch build that Slickrock Station launches. It is RetroArch 1.22.2
  (64-bit and 32-bit ARM) with a small set of patches for keypad phones, under
  its own package name so it installs beside the stock RetroArch and keeps its
  own settings.

  Install Slickrock Station from this repository too; it sets this RetroArch
  up for you.

  RetroArch is free software under the GNU GPL. The patches applied to this
  build are published in the "source" folder of the repository that serves
  it: https://github.com/Bradleyw801/sidephone-apps

RequiresRoot: false

