Name: RetroArch for Slickrock
Summary: The RetroArch build that Slickrock Station runs
Description: |
  This is the RetroArch build Slickrock Station runs. It's regular RetroArch
  with a few input patches, so quick presses always register, even when you
  mash buttons on a keypad or controller. It has its own package name, so it
  installs next to regular RetroArch and keeps its own settings.

  This repository has the 64-bit ARM build. Slickrock Station's Setup gets
  the 32-bit one for older devices.

  Install Slickrock Station from here too. It sets this RetroArch up for
  you.

  RetroArch is free software under the GNU GPL. The patches for each build
  are published here:
  https://github.com/Bradleyw801/sidephone-apps/tree/main/source

