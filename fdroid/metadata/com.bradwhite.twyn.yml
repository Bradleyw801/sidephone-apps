Name: Twyn Keyboard
Summary: A predictive keyboard for any device, built for real keys and small screens
Description: |
  Twyn Keyboard is a predictive keyboard for any Android device. I built
  it for phones with real keys, small screens and other unusual phones,
  and it works just as well with keys on the screen.

  On a keypad, whether it has two letters on each key or is a T9 phone's
  2 to 9, press each key once and the word you meant is in the field by
  the time you finish it. Space keeps it. If it picked another word, tap
  the one you want, or step through them with *.

  On a full keyboard, what you type stays as typed. The strip offers the
  word, a correction or the rest of it, and Space takes the one in the
  middle. On either one, hold a key for the symbol printed on it.

  When there are no keys to type on, Touch puts keys on the screen, a
  Compact QWERTY, a full QWERTY with swipe typing, or a T9 keypad, and
  you can size them to fit.

  It picks words from what you wrote before, learns your words and
  suggests the next one. Open it once after installing to turn it on.

