Name: Texts
Summary: Read and answer your texts, RCS included, on a phone without Google services
Description: |
  Texts is the inbox half of Text Relay. It runs on the phone you carry, which
  can be any Android phone, including one with no Google services at all. Every
  conversation the relay phone receives shows up here, group chats and
  full-size pictures included, and your replies go out from the relay phone's
  number.

  * Laid out like Google Messages: conversations, search, threads with search
    inside them, and each conversation's photos, files and links
  * A notification for each conversation as texts arrive, with no Google
    services, push app or browser needed; silent, or none at all, if you
    prefer
  * New texts arrive within seconds over a light connection to the inbox,
    with a check once a minute as a backup
  * Warns you only when the relay phone has actually lost its connection, with
    a Reconnect button that asks it to come back
  * Pull down to refresh; Resync reloads every conversation and asks the relay
    phone to send the last week again
  * Shows how far the relay phone's full-history sync has got
  * Follows the system's light or dark theme

  Install Relay on the phone that keeps the SIM, then link Texts to it: in
  Relay, tap Link a device, and in Texts, tap Scan QR code. No camera? Type
  the code Relay shows instead.

RequiresRoot: false

