Name: Paigr
Summary: "Beta: read and answer your texts, RCS included, on any Android phone"
Description: |
  Paigr is in beta, so expect some rough edges.

  Paigr is where you read and answer your texts. It runs on the phone you
  carry, which can be any Android phone, even one with no Google services.
  Paigr Relay, on the phone with your SIM, sends it every conversation,
  including group chats and full-size pictures, and your replies go out from
  your real number.

  It's a native app made for small screens. It opens fast with the texts it
  already has, and it works with touch or with a keypad's arrows and OK.
  Each conversation gets its own colour. You can search inside a thread, see
  a conversation's photos, files and links, react with an emoji, quote a
  message in your reply, and send pictures, GIFs and files. New message
  starts a conversation with any number; the relay phone sends the first
  text as SMS.

  You get a notification for each conversation as texts come in, with no
  Google services or push app needed. New texts show up within seconds, and
  Paigr keeps listening while the phone sleeps. If the relay phone loses its
  connection, Paigr tells you and gives you a button to reconnect it. Pull
  down to refresh, or use Resync to reload everything and have the relay
  phone send the last week again.

  Your texts, names and pictures are encrypted on the relay phone and only
  opened here, so the server can't read them. You can also connect through
  Tor with Orbot.

  To set it up, install Paigr Relay on the phone with your SIM and open it.
  It shows a code. In Paigr, tap Scan code and point it at that code. No
  camera? Type the code in instead. If you reinstall Paigr on the same
  phone, it gets back into your inbox by itself.

