Name: Tyle
Summary: Switches your Sidephone's settings when you swap keypad tiles
Description: |
  I built Tyle because I wanted my Sidephone set up differently for each
  keypad tile. Snap a tile on and Tyle switches the phone to the setup you
  picked for it.

  For each tile you can choose the keyboard (TT9 for the number pads,
  SideType or JakeType for the Compact QWERTY), turn Bluetooth on or off,
  set the brightness, and open an app. Like a game when the Mini Controller
  goes on, or a music player for the Sundial.

  Each tile also gets a picture of its keys showing what they do. Tap a key
  to change it, or give it something to do when you hold it.

  Tyle tells which tile is on from the keys you press. The bottom-left key
  of each tile is a safe one to press first.

  It all runs inside Tyle's accessibility service. No root, no Shizuku and
  no notification. After you install it, turn on "Tyle keys" under Settings,
  Accessibility.

RequiresRoot: false

