Name: Paigr Relay
Summary: "Beta: sends this phone's texts, RCS included, to Paigr on your other phone"
Description: |
  Paigr Relay is in beta, so expect some rough edges.

  Paigr Relay goes on the phone that has your SIM and Google Messages. Every
  text that phone gets goes to your inbox, where Paigr on your other phone
  shows it. That's SMS, MMS and RCS, one-to-one and group chats, with names
  and full-size pictures. Replies you write in Paigr go back out through
  Messages from your number, so RCS chats stay RCS.

  Setup is one scan. Open Paigr Relay and it shows a code. Scan it with
  Paigr on your other phone and you're done. There's no account, email or
  password. Your texts, names and pictures are encrypted on this phone
  before they leave it, so the server can't read them.

  If the phone goes offline, texts wait here until the inbox has them, and
  the inbox only ever keeps one copy of each. With message access turned on,
  Paigr Relay also picks up texts you send from this phone and anything a
  notification missed, and it can send your whole history. It checks in
  every minute, so Paigr can warn you if this phone drops off and ask it to
  reconnect.

  If you're leaving this phone at home, there's a guide for that, including
  how to forward your calls. You can link another phone or a browser with
  Link a device, and if you reinstall Paigr Relay on the same phone it gets
  back into your inbox by itself.

  Turn on SMS fallback and replies can still go out when Messages has
  nothing to reply to, and texts to a new number start as SMS from this
  phone. Pictures and files you send from Paigr then go out from this phone
  as MMS. You can also connect through Tor with Orbot, so
  the inbox server never sees this phone's IP address.

  Paigr Relay reads Messages' notifications, so it needs notification
  access, and Messages notifications have to stay on (they can be silent).
  Keep the phone on Wi-Fi and plugged in.

RequiresRoot: false

